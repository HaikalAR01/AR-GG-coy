<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElectroAR Lab 3D</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script><style>body{margin:0;font-family:system-ui;background:#081426;color:white}#ui{position:fixed;z-index:10;top:12px;left:12px;right:12px;pointer-events:none}.panel{background:#07182bdf;border:1px solid #50708a;border-radius:14px;padding:12px;max-width:370px;pointer-events:auto}button,a{background:#1977e8;border:0;color:white;padding:10px;border-radius:9px;margin:4px;cursor:pointer;text-decoration:none;display:inline-block}#status{font-size:13px;color:#a8d4ff}input{width:150px}small{color:#c4d5e4}</style></head><body><div id="ui"><div class="panel"><b>⚡ ElectroAR Lab 3D</b><div id="status">Arahkan kamera ke marker HIRO</div><button id="toggle">Saklar: OFF</button><button id="left">↶ Putar</button><button id="right">Putar ↷</button><div><label>Skala <input id="scale" type="range" min="0.6" max="2" value="1" step="0.05"></label></div><div id="readout">9 V • 330 Ω • 0 mA</div><small>Gunakan HTTPS / localhost dan izinkan kamera. Animasi partikel menunjukkan arus konvensional (+ ke −).</small><div><a href="marker.html" target="_blank">Buka marker HIRO</a></div></div></div><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true; antialias:true" arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;" ><a-marker preset="hiro" id="marker"><a-entity id="model" rotation="0 0 0"><a-box position="-0.62 0.12 0" width="0.32" height="0.24" depth="0.27" color="#20252b"></a-box><a-box position="-0.62 0.255 0" width="0.17" height="0.035" depth="0.1" color="#c6c6c6"></a-box><a-text value="9V" position="-0.78 0.13 0.143" width="0.42" color="#ffffff"></a-text><a-cylinder position="0.05 0.13 -0.43" rotation="0 0 90" radius="0.075" height="0.3" color="#d7b57c"></a-cylinder><a-cylinder position="-0.02 0.13 -0.43" rotation="0 0 90" radius="0.078" height="0.024" color="#ff3838"></a-cylinder><a-cylinder position="0.09 0.13 -0.43" rotation="0 0 90" radius="0.078" height="0.024" color="#ff9a2f"></a-cylinder><a-cylinder position="0.16 0.13 -0.43" rotation="0 0 90" radius="0.078" height="0.024" color="#a45eff"></a-cylinder><a-cylinder position="0.2 0.13 -0.43" rotation="0 0 90" radius="0.078" height="0.024" color="#e9d1b0"></a-cylinder><a-cylinder id="led" position="0.63 0.18 0" radius="0.09" height="0.18" color="#650b12" material="emissive:#230000;emissiveIntensity:0.2"></a-cylinder><a-sphere id="ledtop" position="0.63 0.27 0" radius="0.09" scale="1 0.7 1" color="#650b12" material="emissive:#230000;emissiveIntensity:0.2"></a-sphere><a-box position="0.03 0.07 0.44" width="0.35" height="0.08" depth="0.19" color="#606c7b"></a-box><a-box id="lever" position="0.03 0.15 0.44" rotation="0 0 -30" width="0.25" height="0.035" depth="0.07" color="#f9cb55"></a-box><a-entity id="wires"></a-entity><a-entity id="particles"></a-entity></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>
const $=id=>document.getElementById(id);let on=false,angle=0,phase=0;const model=$('model'),wire=$('wires'),particles=$('particles');const points=[[-.62,.13,-.13],[-.62,.13,-.43],[-.1,.13,-.43],[.3,.13,-.43],[.63,.13,-.43],[.63,.13,0],[.63,.13,.44],[.2,.13,.44],[-.15,.13,.44],[-.62,.13,.44],[-.62,.13,.13]];function segment(a,b,parent,color,r){let A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A);let mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),new THREE.MeshStandardMaterial({color,metalness:.18,roughness:.35}));mesh.position.copy(A).add(B).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());parent.object3D.add(mesh)}wire.addEventListener('loaded',()=>{for(let i=0;i<points.length-1;i++)segment(points[i],points[i+1],wire,0x12b9ed,.018)});let dots=[];particles.addEventListener('loaded',()=>{for(let i=0;i<12;i++){let e=document.createElement('a-sphere');e.setAttribute('radius','.025');e.setAttribute('color','#ffe65b');e.setAttribute('material','emissive:#ffbe00;emissiveIntensity:1');particles.appendChild(e);dots.push(e)}});let lengths=[0],total=0;for(let i=1;i<points.length;i++){total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1],points[i][2]-points[i-1][2]);lengths.push(total)}function at(t){let d=((t%1)+1)%1*total;let i=1;while(i<lengths.length-1&&lengths[i]<d)i++;let u=(d-lengths[i-1])/(lengths[i]-lengths[i-1]);return points[i-1].map((v,k)=>v+(points[i][k]-v)*u)}function render(){let c=on?'#ff3737':'#650b12';for(let id of ['led','ledtop']){$(id).setAttribute('color',c);$(id).setAttribute('material',`emissive:${on?'#ff2020':'#230000'};emissiveIntensity:${on?'1.8':'0.2'}`)}$('lever').setAttribute('rotation',on?'0 0 0':'0 0 -30');$('toggle').textContent='Saklar: '+(on?'ON':'OFF');$('readout').textContent='9 V • 330 Ω • '+(on?'21,2':'0')+' mA'}$('toggle').onclick=()=>{on=!on;render()};$('left').onclick=()=>{angle-=15;model.setAttribute('rotation',`0 ${angle} 0`)};$('right').onclick=()=>{angle+=15;model.setAttribute('rotation',`0 ${angle} 0`)};$('scale').oninput=e=>model.setAttribute('scale',`${e.target.value} ${e.target.value} ${e.target.value}`);$('marker').addEventListener('markerFound',()=>$('status').textContent='Marker terdeteksi ✓');$('marker').addEventListener('markerLost',()=>$('status').textContent='Marker tidak terlihat — arahkan kamera ke marker');let prev=performance.now();function tick(now){let dt=Math.min(.05,(now-prev)/1000);prev=now;if(on)phase+=dt*.25;dots.forEach((e,i)=>{e.setAttribute('visible',on);if(on){let p=at(phase+i/dots.length);e.setAttribute('position',p.join(' '))}});requestAnimationFrame(tick)}requestAnimationFrame(tick);render();</script></body></html>
