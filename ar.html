<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElectroAR • Kamera AR</title><style>body{margin:0;background:#071323;color:#e8f4ff;font:15px system-ui}header{position:fixed;top:0;left:0;right:0;z-index:10;background:#081827dd;padding:12px;display:flex;justify-content:space-between;align-items:center}a,button{color:white;background:#14506d;border:1px solid #42d7ee;border-radius:8px;padding:10px;text-decoration:none;cursor:pointer}#message{position:fixed;bottom:20px;left:12px;right:12px;z-index:10;background:#081827dc;padding:15px;border:1px solid #2c6d85;border-radius:12px;text-align:center}#ar{position:absolute;inset:0}#switch{position:fixed;right:14px;top:78px;z-index:10;display:none}small{color:#a7c1d3}</style></head><body><header><strong>⚡ ElectroAR • Image Tracking</strong><a href="index.html">Keluar AR</a></header><div id="ar"></div><button id="switch">⏻ Saklar OFF</button><div id="message">Memeriksa target AR... <small>Gunakan HTTPS dan izinkan kamera.</small></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const msg=document.getElementById('message'),toggle=document.getElementById('switch');
const targetUrl='assets/target.mind';let closed=false,visible=false,glow,bulb,particles=[];
function say(s){msg.textContent=s}
async function init(){
 try{const response=await fetch(targetUrl,{method:'HEAD'});if(!response.ok)throw Error('File assets/target.mind belum tersedia. Kompilasi assets/marker.svg melalui MindAR Image Target Compiler dan simpan hasilnya sebagai assets/target.mind.');
 const {MindARThree}=await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js');
 const mindar=new MindARThree({container:document.querySelector('#ar'),imageTargetSrc:targetUrl,uiLoading:'yes',uiScanning:'no'});
 const {renderer,scene,camera}=mindar;const anchor=mindar.addAnchor(0);const root=anchor.group;
 scene.add(new THREE.HemisphereLight(0xffffff,0x223344,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(1,3,2);scene.add(light);
 const material=(color,metalness=.2)=>new THREE.MeshStandardMaterial({color,metalness,roughness:.38});
 const base=new THREE.Mesh(new THREE.BoxGeometry(1.1,.035,.65),material('#18364b'));base.position.y=-.02;root.add(base);
 function cube(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);root.add(m);return m}
 function cylinder(rad,len,color,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,16),material(color));m.position.set(x,y,z);root.add(m);return m}
 cube(.24,.16,.16,'#303f56',-.34,.1,-.13);cube(.035,.16,.17,'#f1ba3e',-.43,.1,-.13);cube(.035,.16,.17,'#cbd5e1',-.24,.1,-.13);
 const resistor=cylinder(.052,.27,'#dec5a0',.04,.12,-.13);resistor.rotation.z=Math.PI/2;
 for(let i=0;i<4;i++){const ring=cylinder(.055,.022,['#ef762c','#ef762c','#63391d','#c7a33e'][i],-.05+i*.06,.12,-.13);ring.rotation.z=Math.PI/2}
 cube(.22,.065,.18,'#45586a',.35,.08,-.13);const lever=cube(.027,.15,.025,'#d5e6ee',.35,.17,-.13);
 bulb=new THREE.Mesh(new THREE.SphereGeometry(.085,24,16),new THREE.MeshPhysicalMaterial({color:'#f33652',transparent:true,opacity:.88,transmission:.3,roughness:.16,emissive:'#ff244c',emissiveIntensity:0}));bulb.position.set(.05,.17,.18);root.add(bulb);glow=new THREE.PointLight('#ff3155',0,.5);glow.position.copy(bulb.position);root.add(glow);
 const points=[[-.44,.07,-.13],[-.44,.06,.28],[.05,.06,.28],[.05,.17,.18],[.05,.06,.28],[.48,.06,.28],[.48,.06,-.13],[.21,.08,-.13],[-.10,.08,-.13],[-.22,.08,-.13]];
 const paths=[[[ -.44,.07,-.13],[-.44,.06,.28],[.05,.06,.28],[.05,.17,.18]],[[.05,.17,.18],[.48,.06,.28],[.48,.06,-.13]],[[.21,.08,-.13],[-.10,.08,-.13]],[[-.22,.08,-.13],[-.44,.07,-.13]]];
 for(const pts of paths){const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,35,.012,8,false),material('#41d7f4'));root.add(tube);for(let j=0;j<3;j++){const p=new THREE.Mesh(new THREE.SphereGeometry(.015,8,8),new THREE.MeshBasicMaterial({color:'#ffe17c'}));root.add(p);particles.push({mesh:p,curve,phase:j/3})}}
 toggle.onclick=()=>{closed=!closed;toggle.textContent=closed?'⏻ Saklar ON':'⏻ Saklar OFF';lever.rotation.z=closed?-.35:.35;bulb.material.emissiveIntensity=closed?2:0;glow.intensity=closed?2:0;say(closed?'Rangkaian AR aktif: LED menyala (9 V, 330 Ω, ≈21,2 mA; di atas rekomendasi 20 mA).':'Saklar terbuka: LED mati.')};
 anchor.onTargetFound=()=>{visible=true;toggle.style.display='block';say('Target ditemukan. Tekan saklar untuk menguji rangkaian AR.')};anchor.onTargetLost=()=>{visible=false;toggle.style.display='none';say('Arahkan kamera ke gambar target ElectroAR.')};
 await mindar.start();renderer.setAnimationLoop(()=>{const t=performance.now()/1000;particles.forEach(p=>{p.mesh.visible=visible&&closed;if(p.mesh.visible)p.mesh.position.copy(p.curve.getPoint((t*.22+p.phase)%1))});renderer.render(scene,camera)});
 }catch(e){say('AR belum dapat dimulai: '+e.message+' Gunakan simulator 3D sebagai alternatif.')}}
init();</script></body></html>
